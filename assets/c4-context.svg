<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="mcl-kanban system context">
<title>mcl-kanban system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="690"/>
<rect class="b-per" x="40" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Supervisor</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Runs scripts/fill_board.sh:</text>
<text class="t-desc" x="56" y="116">enlists the crew and mirrors</text>
<text class="t-desc" x="56" y="132">GitHub work into packages</text>
<rect class="b-per" x="365" y="30" width="270" height="104" rx="10"/>
<circle class="head" cx="391" cy="54" r="9"/>
<text class="t-name" x="409" y="58">Owner</text>
<text class="t-type" x="409" y="76">[Person]</text>
<text class="t-desc" x="381" y="100">Raf, through his own SSH</text>
<text class="t-desc" x="381" y="116">tunnel to 127.0.0.1:4010</text>
<rect class="b-per" x="690" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="716" cy="54" r="9"/>
<text class="t-name" x="734" y="58">Crew agent</text>
<text class="t-type" x="734" y="76">[Person]</text>
<text class="t-desc" x="706" y="100">A Claude session holding a</text>
<text class="t-desc" x="706" y="116">Macula key; claims its next</text>
<text class="t-desc" x="706" y="132">card in rank order and works it</text>
<rect class="b-sys" x="365" y="186" width="270" height="152" rx="10"/>
<text class="t-name" x="381" y="214">mcl-kanban</text>
<text class="t-type" x="381" y="232">[mcl_om service and web UI]</text>
<text class="t-desc" x="381" y="256">Serves 39 procedures under</text>
<text class="t-desc" x="381" y="272">mcl-kanban/*, every call sealed,</text>
<text class="t-desc" x="381" y="288">and the owner's LiveView on</text>
<text class="t-desc" x="381" y="304">127.0.0.1:4010. /health is a Unix</text>
<text class="t-desc" x="381" y="320">socket, /run/mcl/health.sock</text>
<rect class="b-ext" x="40" y="430" width="270" height="136" rx="10"/>
<text class="t-name" x="56" y="458">GitHub</text>
<text class="t-type" x="56" y="476">[External system]</text>
<text class="t-desc" x="56" y="500">Open issues, the work-package</text>
<text class="t-desc" x="56" y="516">label, sub-issues and</text>
<text class="t-desc" x="56" y="532">crew:&lt;name&gt; lanes: read by</text>
<text class="t-desc" x="56" y="548">fill_board.sh, not by the service</text>
<rect class="b-mac" x="365" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="458">macula-realm</text>
<text class="t-type" x="381" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="500">Grants scope mcl-kanban for 30</text>
<text class="t-desc" x="381" y="516">days to the node identity key,</text>
<text class="t-desc" x="381" y="532">encoded from MCL_REALM_NAME</text>
<rect class="b-mac" x="690" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="458">Macula stations, mesh DHT</text>
<text class="t-type" x="706" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="706" y="500">The service's mesh entry</text>
<text class="t-desc" x="706" y="516">points; the DHT takes each</text>
<text class="t-desc" x="706" y="532">capability advertisement</text>
<path class="edge" d="M175 150V430" marker-end="url(#a)"/>
<text class="t-rel" x="183" y="290">runs fill_board.sh:</text>
<text class="t-rel" x="183" y="306">reads issues with gh,</text>
<text class="t-rel" x="183" y="322">then calls the board</text>
<path class="edge" d="M280 150V168H400V186" marker-end="url(#a)"/>
<text class="t-rel" x="288" y="160">enlists, opens, files</text>
<path class="edge" d="M500 134V186" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="164">works the ladder</text>
<path class="edge" d="M825 150V168H620V186" marker-end="url(#a)"/>
<text class="t-rel" x="632" y="160">calls claim_next_card,</text>
<text class="t-rel" x="632" y="176">or another procedure</text>
<path class="edge" d="M460 338V430" marker-end="url(#a)"/>
<text class="t-rel" x="468" y="384">identity, scope</text>
<path class="edge" d="M620 338V370H825V430" marker-end="url(#a)"/>
<text class="t-rel" x="632" y="364">advertises each procedure</text>
<text class="t-desc" x="40" y="596">The service calls nothing outside the mesh: GitHub is read by scripts/fill_board.sh on the supervisor's</text>
<text class="t-desc" x="40" y="614">machine, which then calls the board as an ordinary enlisted agent. Nothing deploys it directly either:</text>
<text class="t-desc" x="40" y="632">macula-fleet pins each signed v* release by digest, and no push moves a tag, so the box runs what was signed.</text>
<rect class="b-sys" x="24" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="662">In scope</text>
<rect class="b-per" x="110.8" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="662">Person</text>
<rect class="b-mac" x="184.39999999999998" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="662">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="662">External system</text>
<rect class="b-cmp" x="490.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="662">Container or component</text>
</svg>
